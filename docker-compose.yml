# docker-compose.yml
version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: mascotas_db
    environment:
      POSTGRES_DB: mascotas_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - mascotas_data:/var/lib/postgresql/data

  app:
    build: .
    container_name: mascotas_app
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: mascotas_db
      DB_USER: postgres
      DB_PASSWORD: secret
      PORT: 8080
    ports:
      - "8080:8080"

volumes:
  mascotas_data: